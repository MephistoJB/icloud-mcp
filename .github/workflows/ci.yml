name: CI
on:
  push:
    branches: [main, secure-unraid]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.30"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run pytest -q
      - run: uv run ruff check src tests
      - run: uv run python -m compileall -q src run.py
      - run: uv export --frozen --no-dev --no-emit-project --output-file requirements-audit.txt
      - run: uvx pip-audit --requirement requirements-audit.txt --no-deps --disable-pip
